{% extends "base.html" %}
{% load static %}

{% block content %}

<h1>Definir Horários Disponíveis</h1>
<form method="post">
    {% csrf_token %}
    <label for="data_horario">Data e Hora:</label>
    <input type="datetime-local" id="data_horario" name="data_horario" required>
    <button type="submit" class="btn btn-primary">Adicionar Horário</button>
</form>

<div>
<h2>Horários Disponíveis</h2>
<ul>
    {% for horario in horarios %}
        <li>{{ horario.data_horario }}</li>
    {% endfor %}
</ul>
</div>

{% endblock %}
