{% extends "base.html" %}
{% load static %}

{% block title %}Atendente - Marcação de consulta{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{% static 'css/atendente.css' %}">
{% endblock %}


{% block content %}

<section>
    <div class="row">
        <h2 class="section-heading">Pacientes</h2>
    </div>
    <div class="row">
        <div class="column">
            <div class="card">
                <div class="icon-wrapper">
                    <i class="fa fa-user"></i>
                </div>
                <a href="{% url 'cadastro_paciente' %}"><h3>Cadastro Paciente</h3></a>
                <p>Cadastro de novos pacientes no Sistema</p>
            </div>
        </div>
        <div class="column">
            <div class="card">
                <div class="icon-wrapper">
                    <i class="fa fa-plus-square"></i>
                </div>
                <a href="{% url 'atendente_marcar_consulta' %}"><h3>Marcação de Consulta</h3></a>
                <p>Cadastrar uma consulta</p>
            </div>
        </div>
    </div>
</section>

{% endblock %}
