{% extends "base.html" %}
{% load static %}

{% block title %} Marcar Consulta {% endblock %}
{% block content %}

{% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}

<div class="container">
    <h1 class="text-center my-4">Marcar Consulta</h1>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="especialidade">Escolha a Especialidade:</label>
            <select id="nome" name="nome" class="form-control" required>
                <option value="">-- Selecione --</option>
                {% for especialidade in especialidades %}
                    <option value="{{ especialidade.id }}">{{ especialidade.nome }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block" >Proseguir</button>
    </form>

</div>

{% endblock %}
